<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>无人机外贸助手 · 话术 + 产品知识</title>
<style>
:root{--bg:#edf0f4;--card:#fff;--ink:#1f2933;--muted:#68707c;--acc:#1d4ed8;--accs:#e9effc;--line:#e4e7ec;--note:#f59e0b;--mark:#ffe08a;--teal:#0f766e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang SC","Segoe UI","Microsoft YaHei",sans-serif;font-size:15px;line-height:1.6}
button{font-family:inherit;cursor:pointer}
.topbar{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 2px 10px rgba(15,23,42,.06);padding:12px 22px 10px}
.top-row{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand-title{font-size:19px;font-weight:800}
.brand-sub{font-size:12px;color:var(--muted);margin-top:2px}
.tabs{display:flex;gap:8px}
.tab{border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px 20px;font-size:15px;font-weight:700;color:#444}
.tab.active{background:var(--acc);border-color:var(--acc);color:#fff}
.searchbox{flex:1;min-width:260px;position:relative}
.searchbox input{width:100%;padding:10px 40px 10px 15px;font-size:15px;border:1.5px solid var(--line);border-radius:11px;outline:none;background:#f8fafc}
.searchbox input:focus{border-color:var(--acc);box-shadow:0 0 0 4px rgba(29,78,216,.10)}
#clearBtn{position:absolute;right:9px;top:50%;transform:translateY(-50%);border:none;background:#e5e9f0;border-radius:50%;width:24px;height:24px;display:none}
.filters{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.langbtn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;color:#444}
.langbtn.active{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.tool{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;color:#444}
.tool:hover{border-color:var(--acc);color:var(--acc)}
.layout{display:flex;gap:20px;max-width:1520px;margin:18px auto;padding:0 22px;align-items:flex-start}
.sidebar{width:185px;flex-shrink:0;position:sticky;top:140px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 10px}
.nav-item{display:flex;justify-content:space-between;align-items:center;width:100%;border:none;background:none;text-align:left;padding:9px 11px;border-radius:9px;font-size:13.5px;color:#333}
.nav-item:hover{background:#f1f5f9}
.nav-item.active{background:var(--acc);color:#fff;font-weight:600}
.nav-item .cnt{font-size:11px;background:#eef1f5;color:#555;border-radius:999px;padding:1px 7px}
.nav-item.active .cnt{background:rgba(255,255,255,.25);color:#fff}
.content{flex:1;min-width:0}
.status{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 16px;margin-bottom:14px;font-size:14px}
.status b{color:var(--acc)}
.banner{background:linear-gradient(135deg,#1d4ed8,#2563eb 60%,#3b82f6);color:#fff;border-radius:16px;padding:22px 26px;margin-bottom:16px}
.banner h1{margin:0 0 8px;font-size:20px}
.banner p{margin:0;font-size:14px;opacity:.93;max-width:840px}
.banner .steps{display:flex;flex-wrap:wrap;gap:9px;margin-top:12px}
.banner .step{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);border-radius:10px;padding:7px 13px;font-size:13px}
.catsec{margin-bottom:24px}
.cat-title{display:flex;align-items:center;gap:10px;font-size:16.5px;font-weight:800;color:#12305e;margin:0 0 12px;padding-left:12px;border-left:5px solid var(--acc)}
.cat-title .cnt{font-size:12px;background:var(--accs);color:var(--acc);border-radius:999px;padding:1px 10px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:9px;box-shadow:0 1px 3px rgba(15,23,42,.04)}
.card:hover{box-shadow:0 6px 18px rgba(15,23,42,.09);transform:translateY(-1px)}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.card-title{font-size:15.5px;font-weight:700;color:#0f2440}
.card-badges{display:flex;gap:5px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}
.lang{font-size:10.5px;font-weight:700;border-radius:5px;padding:2px 7px}
.lang-en{background:#dbeafe;color:#1d4ed8}.lang-ru{background:#fee2e2;color:#b91c1c}.lang-ar{background:#ccfbf1;color:#0f766e}.lang-zh{background:#e5e7eb;color:#52525b}
.cat-chip{font-size:11px;color:var(--muted);background:#f1f5f9;border-radius:5px;padding:2px 7px;white-space:nowrap}
.riskbow{font-size:10.5px;background:#fee2e2;color:#b91c1c;border-radius:5px;padding:2px 7px;font-weight:600}
.card-tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{border:1px solid var(--line);background:#f8fafc;color:#4b5563;border-radius:999px;padding:2px 9px;font-size:12px}
.tag:hover{border-color:var(--acc);color:var(--acc)}
.kpis{display:flex;flex-wrap:wrap;gap:6px}
.kpi{background:#ecfdf5;color:#065f46;border-radius:7px;padding:3px 9px;font-size:12.5px;font-weight:600}
.body{font-family:Georgia,serif;font-size:14.5px;line-height:1.75;white-space:pre-wrap;background:#fbfcfe;border:1px solid #eef1f6;border-radius:9px;padding:11px 13px;color:#1f2a3a}
.body[dir=rtl]{font-family:"Geeza Pro","Noto Naskh Arabic",serif;text-align:right;direction:rtl}
.trans{font-size:13.5px;line-height:1.7;white-space:pre-wrap;color:#3d4552;background:#f3f6fa;border:1px solid #e2e8f2;border-left:4px solid #94a3b8;border-radius:8px;padding:9px 12px}
.trans .tl{display:block;font-size:11px;font-weight:700;color:#64748b;letter-spacing:1px;margin-bottom:3px}
.note{font-size:13px;color:#6b4e0a;background:#fffbeb;border:1px solid #fde9b5;border-left:4px solid var(--note);border-radius:8px;padding:8px 11px}
.note b{color:#92400e}
.actions{display:flex;justify-content:flex-end;margin-top:auto;gap:8px}
.copybtn{border:1px solid var(--acc);background:#fff;color:var(--acc);border-radius:9px;padding:6px 13px;font-size:13px;font-weight:600}
.copybtn:hover{background:var(--acc);color:#fff}
.copybtn.copied{background:#16a34a;border-color:#16a34a;color:#fff}
details summary{cursor:pointer;font-size:13.5px;font-weight:700;color:var(--acc)}
table.spec{width:100%;border-collapse:collapse;font-size:13px;margin-top:4px}
table.spec td{padding:5px 8px;border-bottom:1px solid #eef1f6;vertical-align:top}
table.spec td.k{color:#475569;width:37%}
.qa{font-size:13px;line-height:1.7}
.qa b{color:#0f2440}
mark{background:var(--mark);border-radius:3px;padding:0 1px;color:#3a2a00}
.empty{background:#fff;border:1px dashed #c7cdd6;border-radius:14px;padding:42px 20px;text-align:center;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 22px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:100}
#toast.show{opacity:1}
#topBtn{position:fixed;right:26px;bottom:26px;width:44px;height:44px;border-radius:50%;border:none;background:var(--acc);color:#fff;font-size:19px;display:none;box-shadow:0 6px 16px rgba(29,78,216,.35)}
@media (max-width:960px){.sidebar{display:none}.cards{grid-template-columns:1fr}.layout{padding:0 12px}}
@media print{body{background:#fff}.topbar,.sidebar,.card-actions,.actions,.status,#topBtn{display:none!important}.layout{display:block;padding:0}.card{break-inside:avoid;box-shadow:none;border:1px solid #ccc}.cards{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="topbar">
  <div class="top-row">
    <div class="brand">
      <div class="brand-title">🛸 无人机外贸助手</div>
      <div class="brand-sub">话术库 + 产品知识库 · 一键检索 · 对话术速发</div>
    </div>
    <div class="tabs">
      <button class="tab active" id="tabScript">💬 话术库</button>
      <button class="tab" id="tabProd">📦 产品库</button>
    </div>
    <div class="searchbox">
      <input id="q" type="search" placeholder="搜话术/搜产品…（/ 聚焦）">
      <button id="clearBtn">✕</button>
    </div>
    <div class="filters" id="langs"></div>
  </div>
</header>

<div class="layout">
  <nav class="sidebar" id="nav"></nav>
  <main class="content">
    <div id="status"></div>
    <div id="results"></div>
  </main>
</div>
<div id="toast"></div>
<button id="topBtn">↑</button>

<script src="data1.js"></script>
<script src="data2.js"></script>
<script src="data3.js"></script>
<script src="data4.js"></script>
<script src="data5.js"></script>
<script src="data6.js"></script>
<script src="data7.js"></script>
<script src="products.js"></script>
<script src="products_more.js"></script>
<script src="products_catalog.js"></script>
<script src="products_extras.js"></script>
<script src="products_extra2.js"></script>
<script>
(function(){
"use strict";
var SCRIPTS=[].concat(window.CARDS1||[],window.CARDS2||[],window.CARDS3||[],window.CARDS4||[],window.CARDS5||[],window.CARDS6||[],window.CARDS7||[]);
var PRODS=window.PRODUCTS||[];
var state={tab:'script',q:'',sLang:'ALL',pLang:'zh',sCat:'ALL',pCat:'ALL'};
function $(id){return document.getElementById(id);}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function norm(s){return (s||"").toLowerCase();}
function hl(t,q){var o=esc(t);(q||"").trim().split(/\s+/).filter(Boolean).forEach(function(w){o=o.replace(new RegExp("("+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi"),"<mark>$1</mark>");});return o;}
function toast(m){var t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(window._t);window._t=setTimeout(function(){t.classList.remove("show");},1700);}
function copyTxt(text,ok){function d(){toast(ok||"已复制 ✔");}var lg=function(){var a=document.createElement("textarea");a.value=text;a.style.position="fixed";a.style.opacity="0";document.body.appendChild(a);a.select();try{document.execCommand("copy");d();}catch(e){}document.body.removeChild(a);};if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(d,lg);}else lg();}

/* ---------- 话术卡 ---------- */
function scriptMatches(c){
  if(state.sCat!=="ALL"&&c.cat!==state.sCat)return false;
  if(state.sLang!=="ALL"&&c.langs.indexOf(state.sLang)===-1)return false;
  var q=norm(state.q.trim());if(!q)return true;
  return norm([c.title,c.cat,(c.tags||[]).join(" "),c.body,c.trans,c.note].join(" ")).indexOf(q)!==-1;
}
function scriptHTML(c){
  var q=state.q.trim();
  var map={EN:'en',RU:'ru',AR:'ar',ZH:'zh'};
  var badges=(c.langs||[]).map(function(l){return '<span class="lang lang-'+map[l]+'">'+l+'</span>';}).join("");
  var tags=(c.tags||[]).map(function(t){return '<span class="tag" data-kw="'+esc(t)+'">'+esc(t)+'</span>';}).join("");
  var trans=c.trans?'<div class="trans"><span class="tl">🇨🇳 中文译文</span>'+hl(c.trans,q)+'</div>':'';
  var note=c.note?'<div class="note"><b>📌 要点 </b>'+hl(c.note,q)+'</div>':'';
  var btn=c.trans?'📋 复制外文':'📋 复制内容';
  return '<article class="card">'
    +'<div class="card-head"><div class="card-title">'+hl(c.title,q)+'</div><div class="card-badges">'+badges+'<span class="cat-chip">'+esc(c.cat)+'</span></div></div>'
    +(tags?'<div class="card-tags">'+tags+'</div>':'')
    +'<div class="body"'+((c.rtl)?' dir="rtl"':"")+'>'+hl(c.body,q)+'</div>'
    +trans+note
    +'<div class="actions"><button class="copybtn" data-copy="'+c.id+'">'+btn+'</button></div>'
    +'</article>';
}
/* ---------- 产品卡（无图） ---------- */
function prodMatches(p){
  if(state.pCat!=="ALL"&&p.cat!==state.pCat)return false;
  var q=norm(state.q.trim());if(!q)return true;
  var hay=norm([p.cat,p.model,p.name_zh,p.name_en,p.points_zh,p.points_en,(p.kpis||[]).join(" "),JSON.stringify(p.specs),JSON.stringify(p.qa)].join(" "));
  return hay.indexOf(q)!==-1;
}
function pT(p,field){var m={zh:p.points_zh,en:p.points_en,ru:p.points_ru,ar:p.points_ar};return m[state.pLang]||m.zh||m.en||"";}
function prodHTML(p){
  var q=state.q.trim();
  var kpis=(p.kpis||[]).map(function(k){return '<span class="kpi">'+esc(k)+'</span>';}).join("");
  var pts=!p.risky?(function(){var x=pT(p);return x?'<div class="body"><span style="font-size:11px;font-weight:700;color:#0f766e;letter-spacing:1px">✨ 卖点</span><br>'+hl(x,q)+'</div>':'';})():'';
  var risky=p.risky?'<span class="riskbow">⚠ 仅参数</span>':'';
  var specs=(p.specs||[]).filter(function(s){return s[1]||s[0];}).map(function(s){return '<tr><td class="k">'+esc(s[0])+'</td><td class="v">'+esc(s[1])+'</td></tr>';}).join("");
  var qa=(p.qa||[]).filter(function(x){return x[0];}).map(function(x){return '<div class="qa"><b>Q：'+esc(x[0])+'</b><br>A：'+esc(x[1])+'</div>';}).join("");
  var btnLabel='📋 复制产品资料';
  return '<article class="card">'
    +'<div class="card-head"><div class="card-title">'+hl(p.model,q)+'</div>'
    +'<div class="card-badges">'+risky+'<span class="cat-chip">'+esc(p.cat)+'</span></div></div>'
    +(kpis?'<div class="kpis">'+kpis+'</div>':'')
    +pts
    +(specs?'<details><summary>📋 核心参数 / Specifications</summary><table class="spec">'+specs+'</table></details>':'')
    +(qa?'<details><summary>❓ 技术问答 / Q&amp;A</summary>'+qa+'</details>':'')
    +'<div class="actions"><button class="copybtn" data-copy="'+p.id+'">'+btnLabel+'</button></div>'
    +'</article>';
}
function byId(id){var i;for(i=0;i<PRODS.length;i++)if(PRODS[i].id===id)return PRODS[i];return null;}

/* ---------- 渲染 ---------- */
function render(){
  var q=state.q.trim();
  if(state.tab==='script'){
    var list=SCRIPTS.filter(scriptMatches);
    $("status").innerHTML='话术库 · 命中 <b>'+list.length+'</b> 条'+(q?' · 「'+esc(q)+'」':'')+(state.sCat!=="ALL"?' · '+esc(state.sCat):'')+(state.sLang!=="ALL"?' · '+esc(state.sLang):'');
    var html='';
    if(!q&&state.sCat==="ALL"&&state.sLang==="ALL") html+='<div class="banner"><h1>无人机外贸话术库</h1><p>面向俄罗斯/中东（阿联酋）的 FPV/植保/配件外贸话术，俄/阿/英三语 + 整段中文译文。军品仅参数不入话术。</p><div class="steps"><span class="step">① 搜话术或点分类</span><span class="step">② 看中文译文确认意思</span><span class="step">③ 复制外文直接发送</span></div></div>';
    var cats=[];SCRIPTS.forEach(function(c){if(cats.indexOf(c.cat)===-1)cats.push(c.cat);});
    cats.forEach(function(c){var l=list.filter(function(x){return x.cat===c;});if(!l.length)return;html+='<section class="catsec"><h2 class="cat-title">'+esc(c)+' <span class="cnt">'+l.length+'</span></h2><div class="cards">';l.forEach(function(x){html+=scriptHTML(x);});html+='</div></section>';});
    $("results").innerHTML=html||emptyHTML();
    // nav
    var nav='<div class="nav-item active" data-cat="ALL"><span>全部</span><span class="cnt">'+list.length+'</span></div>';
    cats.forEach(function(c){var n=list.filter(function(x){return x.cat===c;}).length;if(!n)return;nav+='<div class="nav-item'+(state.sCat===c?' active':'')+'" data-cat="'+esc(c)+'"><span>'+esc(c)+'</span><span class="cnt">'+n+'</span></div>';});
    $("nav").innerHTML=nav;
  } else {
    var plist=PRODS.filter(prodMatches);
    $("status").innerHTML='产品库 · 命中 <b>'+plist.length+'</b> 款'+(q?' · 「'+esc(q)+'」':'')+(state.pCat!=="ALL"?' · '+esc(state.pCat):'');
    var phtml='';
    if(!q&&state.pCat==="ALL") phtml+='<div class="banner" style="background:linear-gradient(135deg,#0f766e,#115e59)"><h1>无人机产品知识库</h1><p>全系 <b>'+PRODS.length+'</b> 款：巡检航拍机、FPV 穿越机、植保重载、吊舱、光纤、AI模块、球机、配件。军品仅标参数。图片不含。</p><div class="steps"><span class="step">① 搜型号或点分类</span><span class="step">② 切换中/英/俄/阿看卖点</span><span class="step">③ 军品只标参数</span></div></div>';
    var pcats=[];PRODS.forEach(function(p){if(pcats.indexOf(p.cat)===-1)pcats.push(p.cat);});
    pcats.forEach(function(c){var l=plist.filter(function(x){return x.cat===c;});if(!l.length)return;phtml+='<section class="catsec"><h2 class="cat-title">'+esc(c)+' <span class="cnt">'+l.length+'</span></h2><div class="cards">';l.forEach(function(x){phtml+=prodHTML(x);});phtml+='</div></section>';});
    $("results").innerHTML=phtml||emptyHTML();
    var pnav='<div class="nav-item active" data-cat="ALL"><span>全部</span><span class="cnt">'+plist.length+'</span></div>';
    pcats.forEach(function(c){var n=plist.filter(function(x){return x.cat===c;}).length;if(!n)return;pnav+='<div class="nav-item'+(state.pCat===c?' active':'')+'" data-cat="'+esc(c)+'"><span>'+esc(c)+'</span><span class="cnt">'+n+'</span></div>';});
    $("nav").innerHTML=pnav;
  }
  $("clearBtn").style.display=q?"block":"none";
  buildLangs();
}
function emptyHTML(){return '<div class="empty">没有命中「'+esc(state.q)+'」— 换个关键词试试</div>';}
function buildLangs(){
  var h;
  if(state.tab==='script'){
    h='<button class="langbtn active" data-l="ALL">全部</button><button class="langbtn" data-l="EN">EN</button><button class="langbtn" data-l="RU">RU</button><button class="langbtn" data-l="AR">AR</button><button class="langbtn" data-l="ZH">中文</button>';
    h+='<button class="tool" data-act="print">🖨 打印/存PDF</button><button class="tool" data-act="reset">↺ 重置</button>';
    $("langs").innerHTML=h;
    $("langs").querySelectorAll('.langbtn').forEach(function(b){b.classList.toggle('active',b.getAttribute('data-l')===state.sLang);});
  } else {
    h='<button class="langbtn active" data-l="zh">中文</button><button class="langbtn" data-l="en">EN</button><button class="langbtn" data-l="ru">RU</button><button class="langbtn" data-l="ar">AR</button>';
    h+='<button class="tool" data-act="print">🖨 打印/存PDF</button><button class="tool" data-act="reset">↺ 重置</button>';
    $("langs").innerHTML=h;
    $("langs").querySelectorAll('.langbtn').forEach(function(b){b.classList.toggle('active',b.getAttribute('data-l')===state.pLang);});
  }
}
$("tabScript").addEventListener("click",function(){state.tab='script';document.getElementById("tabScript").classList.add("active");document.getElementById("tabProd").classList.remove("active");render();});
$("tabProd").addEventListener("click",function(){state.tab='product';document.getElementById("tabProd").classList.add("active");document.getElementById("tabScript").classList.remove("active");render();});
$("q").addEventListener("input",function(){state.q=this.value;render();});
document.addEventListener("click",function(e){
  var t=e.target;
  if(t.id==="clearBtn"){state.q="";$("q").value="";render();return;}
  if(t.classList.contains("tag")){state.q=t.getAttribute("data-kw");$("q").value=state.q;render();return;}
  var n=t.closest(".nav-item");if(n){if(state.tab==='script')state.sCat=n.getAttribute("data-cat");else state.pCat=n.getAttribute("data-cat");render();return;}
  if(t.classList.contains("langbtn")){var l=t.getAttribute("data-l");if(state.tab==='script')state.sLang=l;else state.pLang=l;render();return;}
  if(t.getAttribute&&t.getAttribute("data-act")==="print"){window.print();return;}
  if(t.getAttribute&&t.getAttribute("data-act")==="reset"){state={tab:state.tab,q:'',sLang:'ALL',pLang:'zh',sCat:'ALL',pCat:'ALL'};$("q").value="";render();window.scrollTo({top:0,behavior:"smooth"});return;}
  if(t.classList.contains("copybtn")){
    var id=t.getAttribute("data-copy");
    if(state.tab==='product'){var p=byId(id);if(p){var ptxt=!p.risky?pT(p):"";var st=(p.specs||[]).map(function(s){return s[0]+(s[1]?": "+s[1]:"");}).join("\n");copyTxt("【"+p.model+"】"+(ptxt?"\n"+ptxt:"")+(st?"\n"+st:""),"已复制产品资料 ✔");}}
    else{var sc=SCRIPTS.filter(function(x){return x.id===id;})[0];if(sc)copyTxt(sc.body,"已复制外文 ✔");}
    var orig=t.textContent;
    t.classList.add("copied");t.textContent="✔ 已复制";
    setTimeout(function(){t.classList.remove("copied");t.textContent=orig;},1400);
    return;
  }
  if(t.id==="topBtn"){window.scrollTo({top:0,behavior:"smooth"});return;}
});
document.addEventListener("keydown",function(e){if(e.key==="/"&&document.activeElement!==$("q")){e.preventDefault();$("q").focus();}if(e.key==="Escape"){$("q").blur();}});
window.addEventListener("scroll",function(){$("topBtn").style.display=window.scrollY>400?"block":"none";});
render();
})();
</script>
</body>
</html>
